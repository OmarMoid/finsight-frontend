<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch/home indicator;
         the safe-area insets in index.css keep content clear of them.
         user-scalable=no stops iOS zooming the whole UI on input focus. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="FinSight - Institutional-Grade Market Intelligence for ASX & US markets." />
    <meta name="theme-color" content="#080c17" />
    <!-- The FinSight mark, inlined so the tab icon costs no extra request and
         stays identical to components/common/Logo.jsx. -->

      rel="icon"

    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>FinSight - Market Intelligence</title>
    <style>
      /* Prevent flash of unstyled background before CSS loads. */
      html, body { background: var(--bg, #0a0e1a); margin: 0; }
    </style>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
